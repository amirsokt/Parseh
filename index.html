function normalizeUsage(data){var out={};var stats=data&&(data.stats||data.data||data.usage||data);function add(point){if(!point||typeof point!=="object")return;var key=point.period_start||point.time||point.date||point.created_at;var value=point.total_traffic||point.traffic||point.used_traffic||point.value||0;if(!key)return;out[key]=(out[key]||0)+(Number(value)||0);}
if(Array.isArray(stats))stats.forEach(add);else if(stats&&typeof stats==="object"){Object.keys(stats).forEach(function(key){if(Array.isArray(stats[key]))stats[key].forEach(add);else if(typeof stats[key]==="number")out[key]=(out[key]||0)+ stats[key];});}

function renderUsage(points,range){points=points||[];if(!points.length){$("usage-total").textContent=tr("usageTotal")+ ": —";$("chart").innerHTML='<div class="empty">' + esc(tr("noUsage"))+ '</div>';return;}

function tick(time,range,index,count){var d=new Date(time||Date.now()- Math.max(0,count - 1 - index)*(range==="1d"?3*3600000:86400000));if(isNaN(d.getTime()))return "";try{return new Intl.DateTimeFormat(range==="1d"?"en-US":(fa()?"fa-IR":"en-US"),{hour:range==="1d"?"2-digit":undefined,hour12:false,weekday:range!=="1d"?"short":undefined}).format(d).replace(/^24$/,"00");}catch(e){return "";}}

function canonical(value){value=String(value||"other").toLowerCase().replace(/[\s_-]+/g,"");if(value==="iphone"||value==="ipad"||value==="ipados")return "ios";if(value==="mac"||value==="macosx"||value==="macintosh")return "macos";if(value==="win"||value==="win32"||value==="win64")return "windows";if(value==="tvos"||value==="appletvos")return "appletv";if(value==="googletv"||value==="firetv")return "androidtv";if(value==="browser"||value==="pwa")return "web";return value||"other";}

function wireguardConfigText(raw){raw=String(raw||"").trim();if(/^\[Interface\]/i.test(raw))return raw.slice(-1)==="\n"?raw:raw + "\n";if(!/^wireguard:\/\//i.test(raw))return null;try{var u=new URL(raw);var p=u.searchParams;var privateKey=decodeSafe(u.username||wgParam(p,"privatekey")||"");var publicKey=wgParam(p,"publickey");var address=wgParam(p,"address");var endpoint=wgParam(p,"endpoint");if(!privateKey||!publicKey||!address)return null;var host=u.hostname;if(host&&host.indexOf(":")>=0&&host.charAt(0)!=="[")host="[" + host + "]";if(!endpoint)endpoint=u.port?host + ":" + u.port:host;var lines=["[Interface]","PrivateKey = " + privateKey.replace(/\s/g,"+"),"Address = " + wgList(address)];var dns=wgParam(p,"dns");if(dns)lines.push("DNS = " + wgList(dns));var mtu=wgParam(p,"mtu");if(mtu)lines.push("MTU = " + mtu);var reserved=wgParam(p,"reserved");if(reserved)lines.push("Reserved = " + reserved);lines.push("","[Peer]","PublicKey = " + publicKey.replace(/\s/g,"+"));var psk=wgParam(p,"presharedkey");if(psk)lines.push("PresharedKey = " + psk.replace(/\s/g,"+"));lines.push("AllowedIPs = " + wgList(wgParam(p,"allowedips")||"0.0.0.0/0, ::/0"));lines.push("Endpoint = " + endpoint);var keepalive=wgParam(p,"keepalive")||wgParam(p,"persistentkeepalive");lines.push("PersistentKeepalive = " +(keepalive||"25"));return lines.join("\n")+ "\n";}catch(e){return null;}}
